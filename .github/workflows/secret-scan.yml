name: secret-scan

# Backstop against secrets landing in this vault. The real prevention is .gitignore (personal
# config stays out of the tree); this catches anything that slips through — including history.
# Note: CI runs AFTER a push, so a hit means "rotate now", not "blocked". For true push-time
# blocking, enable GitHub secret-scanning push protection in org settings (needs GHAS).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          # base:"" scans the full history of head each run (this vault is small), which also
          # sidesteps the "BASE and HEAD are the same" error on pushes to a single branch.
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --results=verified,unknown
